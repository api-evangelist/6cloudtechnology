aid: 6cloudtechnology
name: 6Cloud Technology
description: '6Cloud Technology (Chinese name 六方云; legal entity Beijing 6Cloud Information
  Technology Co., Ltd. / 北京六方云信息技术有限公司) is a Beijing-based industrial and critical-infrastructure
  cybersecurity product vendor founded in 2018 and backed by China''s Ministry of Science and
  Technology results-transformation fund. It builds and sells appliances and platforms across
  five product lines plus a security-services practice: industrial control security (LinSec —
  industrial firewall, industrial network audit and intrusion detection, industrial host guard,
  data diode/gateway, vulnerability scanner, asset and risk management), network security (NSec
  — next-generation firewall, IPS, IDS, operations management and audit, log audit and analysis,
  database audit), cloud security (CSec — distributed virtual firewall, distributed virtual IDS,
  cloud security resource scheduling), AI security (AiSec — network threat detection and
  retrospection), and situational-awareness security (CdSec — industrial situational awareness
  and security operations platform), alongside simulation and training range systems. It markets
  under an "AI gene, threat immunity" positioning and sells into rail transit, power, oil and gas
  and petrochemicals, public services, water conservancy, intelligent manufacturing, and smart
  mining. Products are delivered as vendor-sold appliances and platforms; the company publishes
  no public developer program, API reference, or machine-readable specification.'
